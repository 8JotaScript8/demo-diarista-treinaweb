<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <title>Formulário de Diarista</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-house-heart-fill me-2"></i>Diaristas App
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/diaristas}">Diaristas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/diaristas/novo}">Nova Diarista</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm" style="border-radius: 12px;">
                    <div class="card-header bg-white border-bottom-0 pt-4">
                        <h2 class="h4 mb-0">
                            <i class="bi bi-person-plus-fill text-primary me-2"></i>
                            Nova Diarista
                        </h2>
                        <p class="text-muted small mb-0 mt-1">Preencha os dados para cadastrar uma nova profissional</p>
                    </div>
                    <div class="card-body px-4 pb-4">
                        <form method="POST" th:action="@{/diaristas/novo}" th:object="${diarista}">
                            <div class="mb-3">
                                <label for="nome" class="form-label fw-semibold">
                                    <i class="bi bi-person me-1"></i>Nome completo
                                </label>
                                <input type="text" class="form-control form-control-lg" id="nome" 
                                       th:field="*{nome}" placeholder="Digite o nome completo" required>
                            </div>
                            <div class="mb-3">
                                <label for="cpf" class="form-label fw-semibold">
                                    <i class="bi bi-card-text me-1"></i>CPF
                                </label>
                                <input type="text" class="form-control form-control-lg" id="cpf" 
                                       th:field="*{cpf}" placeholder="000.000.000-00" required>
                                <div class="form-text">Apenas números, sem formatação</div>
                            </div>
                            <div class="mb-3">
                                <label for="endereco" class="form-label fw-semibold">
                                    <i class="bi bi-geo-alt me-1"></i>Endereço
                                </label>
                                <input type="text" class="form-control form-control-lg" id="endereco" 
                                       th:field="*{endereco}" placeholder="Rua, número, bairro, cidade">
                            </div>
                            <div class="mb-4">
                                <label for="telefone" class="form-label fw-semibold">
                                    <i class="bi bi-telephone me-1"></i>Telefone
                                </label>
                                <input type="text" class="form-control form-control-lg" id="telefone" 
                                       th:field="*{telefone}" placeholder="(00) 00000-0000" required>
                            </div>
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/diaristas}" class="btn btn-outline-secondary me-md-2">
                                    <i class="bi bi-arrow-left me-1"></i>Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-check-lg me-1"></i>Cadastrar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light text-center text-muted py-4 mt-5 border-top">
        <div class="container">
            <p class="mb-0">Diaristas App &copy; 2026 - Projeto de estudo Spring Boot</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>
</html>
