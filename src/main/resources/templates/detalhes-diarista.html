<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <title>Detalhes do Diarista</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-house-heart-fill me-2"></i>Diaristas App
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/diaristas}">Diaristas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/diaristas/novo}">Nova Diarista</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="card shadow-sm mx-auto" style="max-width: 560px;">
            <div class="card-header bg-white">
                <h1 class="h4 mb-0">Detalhes do Diarista</h1>
            </div>
            <div class="card-body" th:if="${diarista != null}">
                <dl class="row mb-0">
                    <dt class="col-sm-4">Nome</dt>
                    <dd class="col-sm-8" th:text="${diarista.nome}"></dd>

                    <dt class="col-sm-4">CPF</dt>
                    <dd class="col-sm-8" th:text="${diarista.cpf}"></dd>

                    <dt class="col-sm-4">Telefone</dt>
                    <dd class="col-sm-8" th:text="${diarista.telefone}"></dd>

                    <dt class="col-sm-4">Endereço</dt>
                    <dd class="col-sm-8" th:text="${diarista.endereco}"></dd>
                </dl>
            </div>
            <div class="card-body text-center text-muted" th:if="${diarista == null}">
                Diarista não encontrada.
            </div>
            <div class="card-footer bg-white border-top-0">
                <a th:href="@{/diaristas}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Voltar para a lista
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-light text-center text-muted py-4 mt-5 border-top">
        <div class="container">
            <p class="mb-0">Diaristas App &copy; 2026 - Projeto de estudo Spring Boot</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>
</html>
